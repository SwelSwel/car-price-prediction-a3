name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          pip install numpy scikit-learn joblib pytest matplotlib
      
      - name: Run tests
        run: |
          PYTHONPATH=${{ github.workspace }} python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t swelswel/car-prediction-dash:a3.0 ./app
          docker push swelswel/car-prediction-dash:a3.0

      - name: Debug SSH connectivity
        run: |
          ssh-keyscan -p 22 bazooka.cs.ait.ac.th || echo "Cannot reach bazooka"
          ssh-keyscan -p 22 ml-brain.cs.ait.ac.th || echo "Cannot reach ml-brain"
          
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ml-brain.cs.ait.ac.th
          username: st127401
          password: ${{ secrets.SSH_PASSWORD }}
          proxy_host: bazooka.cs.ait.ac.th
          proxy_username: st127401
          proxy_password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/
            docker pull swelswel/car-prediction-dash:a3.0
            docker compose -f docker-compose.yaml down
            docker compose -f docker-compose.yaml up -d