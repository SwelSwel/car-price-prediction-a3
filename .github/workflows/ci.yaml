name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          pip install numpy scikit-learn joblib pytest matplotlib
      
      - name: Run tests
        run: |
          PYTHONPATH=${{ github.workspace }} python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t swelswel/car-prediction-dash:a3.0 ./app
          docker push swelswel/car-prediction-dash:a3.0

      - name: Deploy to server
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          export SSHPASS="${{ secrets.SSH_PASSWORD }}"
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          sshpass -e ssh -o StrictHostKeyChecking=no -o ProxyCommand="sshpass -e ssh -o StrictHostKeyChecking=no -W %h:%p st127401@bazooka.cs.ait.ac.th" -i ~/.ssh/id_ed25519 st127401@ml.brain.cs.ait.ac.th << 'EOF'
            docker pull swelswel/car-prediction-dash:a3.0
            docker compose -f docker-compose.yaml down
            docker compose -f docker-compose.yaml up -d
          EOF